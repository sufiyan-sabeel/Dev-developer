  <style>
    :root{
      --bg:#08090B;--surface:#101216;--card:#13161C;--text:#F5F6F7;--muted:#9299A3;--dim:#646B76;
      --accent:#68A9FF;--cyan:#73DCEB;--border:rgba(255,255,255,.08);
      --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      line-height:1.6;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;min-height:100vh;
    }
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;width:100%}
    .card{
      max-width:620px;width:100%;background:var(--card);border:1px solid var(--border);
      border-radius:20px;padding:48px 40px;text-align:center;position:relative;overflow:hidden;
      box-shadow:0 24px 64px rgba(0,0,0,.6);
    }
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--accent),var(--cyan))}
    .code{font-family:var(--mono);font-size:clamp(3.5rem,14vw,5.5rem);font-weight:700;line-height:1;
      background:linear-gradient(135deg,var(--text) 30%,var(--accent) 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    h1{font-size:clamp(1.25rem,4vw,1.6rem);margin:18px 0 10px;letter-spacing:-.02em}
    p{color:var(--muted);font-size:.95rem;max-width:46ch;margin:0 auto}
    .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px}
    a.btn{
      display:inline-flex;align-items:center;gap:8px;text-decoration:none;
      font-size:.875rem;font-weight:600;padding:11px 18px;border-radius:8px;
      border:1px solid var(--border);color:var(--muted);transition:all .28s cubic-bezier(.16,1,.3,1)
    }
    a.btn:hover{color:var(--text);border-color:rgba(104,169,255,.35)}
    a.btn.primary{background:rgba(104,169,255,.1);border-color:rgba(104,169,255,.35);color:var(--accent)}
    footer{padding:24px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;
      border-top:1px solid var(--border)}
    footer a{color:var(--muted);text-decoration:none}
    footer a:hover{color:var(--accent)}
    @media (max-width:480px){.card{padding:36px 22px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <div class="code">404</div>
      <h1>This page doesn&rsquo;t exist</h1>

      <nav class="links" aria-label="Helpful links">
        <a class="btn primary" href="/Dev-developer/">Back to homepage</a>
        <a class="btn" href="/Dev-developer/#projects">Projects</a>
        <a class="btn" href="/Dev-developer/#dashboard">Dashboard</a>
        <a class="btn" href="/Dev-developer/#terminal">Terminal</a>
        <a class="btn" href="/Dev-developer/#contact">Contact</a>
      </nav>
    </div>
  </main>
  <footer>
    DEV DEVELOPER &mdash; <a href="/Dev-developer/">sufiyan-sabeel.github.io/Dev-developer</a>
  </footer>
</body>
</html>
